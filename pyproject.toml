[project]
name = "agentic-sre"
version = "0.1.0"
description = "Anonymised Thai e-commerce retailer: a real Cloud Run system, its incidents, and two generations of an agentic SRE (ADK single agent -> ADK multi-agent with a control plane)."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "pyyaml>=6",
  "jinja2>=3",
  "pydantic>=2",
  "google-adk>=2.9,<3",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pytest-asyncio>=0.24"]
gcp = ["google-cloud-monitoring>=2", "google-cloud-logging>=3", "google-cloud-run>=0.10", "google-cloud-aiplatform[agent_engines]>=1.100", "google-cloud-storage>=2"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["system", "agents", "evals", "mcp_servers"]
